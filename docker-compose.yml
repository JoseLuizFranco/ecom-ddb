# Cluster YugabyteDB com 3 nós (fator de replicação 3) + aplicação do Portal B2B.
#
#   docker compose up -d --build
#
# Nós do banco expostos no host:
#   yb1 -> localhost:5433   yb2 -> localhost:5434   yb3 -> localhost:5435
# Painel do cluster: http://localhost:15433   Aplicação: http://localhost:3000

x-yb: &yb
  image: yugabytedb/yugabyte:2.25.2.0-b359
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -U yugabyte -c 'select 1' >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 60

services:
  yb1:
    <<: *yb
    hostname: yb1
    command: >
      bin/yugabyted start --background=false
      --advertise_address=yb1
      --cloud_location=local.goiania.zona-a
      --tserver_flags=yb_enable_read_committed_isolation=true
    ports:
      - "5433:5433"
      - "15433:15433"
      - "7000:7000"

  yb2:
    <<: *yb
    hostname: yb2
    command: >
      bin/yugabyted start --background=false
      --advertise_address=yb2 --join=yb1
      --cloud_location=local.goiania.zona-b
      --tserver_flags=yb_enable_read_committed_isolation=true
    ports:
      - "5434:5433"
    depends_on:
      yb1:
        condition: service_healthy

  yb3:
    <<: *yb
    hostname: yb3
    command: >
      bin/yugabyted start --background=false
      --advertise_address=yb3 --join=yb1
      --cloud_location=local.goiania.zona-c
      --tserver_flags=yb_enable_read_committed_isolation=true
    ports:
      - "5435:5433"
    depends_on:
      yb2:
        condition: service_healthy

  # Cria o esquema e popula o banco (idempotente) depois que os 3 nós sobem.
  db-init:
    image: yugabytedb/yugabyte:2.25.2.0-b359
    restart: "no"
    depends_on:
      yb3:
        condition: service_healthy
    volumes:
      - ./db/yugabyte:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for f in /sql/01_schema.sql /sql/02_seed_laboratorio.sql /sql/03_seed_complementar.sql; do
          echo "Aplicando $$f"
          bin/ysqlsh -h yb1 -U yugabyte -v ON_ERROR_STOP=1 -f "$$f"
        done

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOSTS: yb1:5433,yb2:5433,yb3:5433
      DB_USER: yugabyte
      DB_NAME: yugabyte
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
